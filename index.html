<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Misja: Wnętrze komputera · Klasa 5</title><style>
:root{--ink:#15253d;--muted:#64748b;--blue:#2862ce;--orange:#ff9b38;--line:#dce5f0;--paper:#fff;--bg:#f3f7fc;--good:#147e53;--bad:#b33c45}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,'Segoe UI',sans-serif}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffb951;outline-offset:3px}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brand{font-weight:900;letter-spacing:-.04em;font-size:1.15rem}.tiny{font-size:.8rem;color:var(--muted)}.pill{background:#e7efff;color:#2354ab;border-radius:99px;padding:6px 12px;font-weight:800;font-size:.85rem}.hero{background:linear-gradient(120deg,#163b83,#3877e4 65%,#528bfa);padding:36px;border-radius:25px;color:white;position:relative;overflow:hidden}.hero:after{content:'✦  ⚙  ✧';position:absolute;right:2%;top:14%;font-size:6rem;color:#ffffff25;transform:rotate(-12deg);pointer-events:none}h1{font-size:clamp(2.2rem,5vw,4.1rem);line-height:1.1;letter-spacing:-.05em;margin:12px 0}h2{font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.2;letter-spacing:-.03em;margin:8px 0 12px}h3{margin:0 0 8px}.hero p{max-width:600px;font-size:1.07rem}.eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:.76rem;font-weight:900;color:#cae0ff}.btn{border:0;padding:12px 20px;border-radius:13px;background:var(--blue);color:white;font-weight:800}.btn:hover{filter:brightness(.95)}.btn:disabled{opacity:.45;cursor:not-allowed}.btn.secondary{background:#e8eef8;color:#1b376a}.btn.ghost{border:1px solid #d9e2ed;background:white;color:#354a68}.btn.large{font-size:1.12rem;padding:16px 25px;background:#ffb94b;color:#203455}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:14px 18px}.stat b{display:block;font-size:1.35rem}.stat span{font-size:.83rem;color:var(--muted)}.panel{background:white;border:1px solid var(--line);border-radius:24px;padding:clamp(20px,3vw,34px);box-shadow:0 14px 36px #1d47730a}.headrow{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}.progress{height:10px;background:#e8eff9;border-radius:99px;overflow:hidden;margin:14px 0 26px}.progress>div{height:100%;background:linear-gradient(90deg,#f2a23d,#3476e9);transition:width .25s}.lesson{background:#eff6ff;border-left:4px solid #4f8aec;padding:16px 18px;border-radius:13px;margin:17px 0 23px}.lesson strong{display:block;margin-bottom:3px}.muted{color:var(--muted)}.board{background:#f8fafd;border:1px solid #e0e8f2;border-radius:20px;padding:18px;margin:16px 0}.grid{display:grid;gap:12px}.cols2{grid-template-columns:repeat(2,minmax(0,1fr))}.cols3{grid-template-columns:repeat(3,minmax(0,1fr))}.cols4{grid-template-columns:repeat(4,minmax(0,1fr))}.choice,.tile,.target,.step{background:white;border:2px solid #dfe7f1;border-radius:15px;padding:16px;transition:.15s}.choice{text-align:left;min-height:65px}.choice:hover,.tile:hover{border-color:#7ca8ed;transform:translateY(-1px)}.choice.selected,.tile.selected{border-color:#2766d3;background:#eaf2ff}.choice.correct,.target.correct{border-color:#20a06c;background:#e8fbf1}.choice.wrong,.target.wrong{border-color:#dc5c65;background:#fff0f0}.tile{display:flex;align-items:center;justify-content:center;gap:9px;font-weight:750;text-align:center;min-height:70px;user-select:none}.tile[draggable=true]{cursor:grab}.target{min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;text-align:center;cursor:pointer}.target small{color:var(--muted)}.target .assigned{background:#e4efff;border-radius:8px;padding:4px 10px;font-weight:750}.icon{font-size:2.2rem;line-height:1.3}.tasklabel{font-size:.85rem;font-weight:900;color:#2c64c6;text-transform:uppercase;letter-spacing:.11em}.hint{font-size:.88rem;color:#60738d}.notice{border-radius:14px;padding:14px 16px;margin:14px 0;font-weight:650}.notice.ok{background:#e4f8ed;color:#146b49}.notice.no{background:#fff0e8;color:#864414}.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.space{justify-content:space-between}.foot{margin-top:21px;border-top:1px solid var(--line);padding-top:18px}.device{border-radius:18px;padding:16px;background:white;border:1px solid var(--line);text-align:center}.device .icon{font-size:3.4rem}.device strong{display:block}.orderitem{display:flex;align-items:center;justify-content:space-between;gap:9px;background:white;border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:8px}.orderitem .btn{padding:6px 11px;border-radius:9px}.switch{border:2px solid var(--line);padding:13px;border-radius:12px;background:white;font-weight:750;min-width:104px}.switch.on{background:#e7f8f0;border-color:#46ba8b;color:#13714b}.switch.off{background:#fff0f0;border-color:#e49a9e;color:#973f45}.case{background:#17263a;border:9px solid #435b78;border-radius:20px;min-height:310px;padding:18px;display:grid;grid-template-columns:repeat(2,1fr);gap:10px;box-shadow:inset 0 0 0 4px #223b57}.slot{background:#293e56;border:2px dashed #7f97b3;color:white;border-radius:12px;min-height:95px;display:grid;place-items:center;text-align:center;padding:10px}.slot.placed{background:#1e7559;border-style:solid;border-color:#77e3bc}.part{padding:11px;border:2px solid #dbe5ef;border-radius:12px;background:white;cursor:pointer;text-align:center;font-weight:800}.part.active{border-color:#2e72dd;background:#e9f2ff}.part.used{opacity:.38}.bigword{font-size:1.2rem;font-weight:850}.diagram{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.diagram>div{background:#fff;border:2px solid #dfe7f1;border-radius:14px;text-align:center;padding:16px;min-width:130px}.diagram .arrow{font-size:2rem;color:#eb9b2c}.report{background:#eff8ff;border-radius:18px;padding:24px}.printonly{display:none}.answerbox{font:inherit;width:100%;border:2px solid var(--line);padding:12px;border-radius:12px}.mini{font-size:.82rem}hr{border:none;border-top:1px solid var(--line);margin:20px 0}@media(max-width:650px){.shell{padding:12px}.hero{padding:25px}.stats{grid-template-columns:1fr 1fr}.cols3,.cols4{grid-template-columns:repeat(2,minmax(0,1fr))}.cols2{grid-template-columns:1fr}.case{min-height:245px}.tile,.choice{padding:12px}.top{align-items:start}}@media print{body{background:white}.no-print{display:none!important}.printonly{display:block}.shell{max-width:none}.panel{box-shadow:none;border:0}}
</style></head><body><main class="shell"><header class="top no-print"><div class="brand">⚡ LABORATORIUM INFORMATYKI <span class="tiny">/ Klasa 5</span></div><button class="btn ghost" id="restartTop">↻ Zacznij od nowa</button></header><div id="app"></div></main><script>
'use strict';
const KEY='misja_komputer_v5_2026';const missions=[
{title:'Poznaj zestaw komputerowy',type:'match',time:'4 min',intro:'Monitor pokazuje obraz. Klawiatura służy do wpisywania tekstu. Mysz pozwala wskazywać i wybierać elementy. W obudowie komputera znajdują się jego najważniejsze podzespoły.',prompt:'Dopasuj nazwy do opisów. Kliknij nazwę, a potem odpowiednie pole.',items:[['Monitor','Pokazuje obraz na ekranie.'],['Klawiatura','Pozwala wpisywać litery i cyfry.'],['Mysz','Służy do wskazywania i klikania.'],['Obudowa','Mieści i chroni podzespoły komputera.']]},
{title:'Odkryj wnętrze komputera',type:'case',time:'5 min',intro:'Procesor wykonuje obliczenia i instrukcje programów. RAM przechowuje dane potrzebne podczas bieżącej pracy. Dysk SSD przechowuje pliki również po wyłączeniu komputera. Płyta główna łączy podzespoły.',prompt:'Zamontuj CZTERY potrzebne części w odpowiednich miejscach. Kliknij część pod obudową, a potem jej pole. Dwie propozycje są zbędne.',items:[['Procesor','Wykonuje obliczenia'],['Pamięć RAM','Przechowuje dane na czas pracy'],['Dysk SSD','Zapisuje pliki na dłużej'],['Płyta główna','Łączy podzespoły']],extras:['Skaner','Projektor']},
{title:'RAM czy dysk?',type:'sort',time:'4 min',intro:'RAM to pamięć robocza: po całkowitym odłączeniu zasilania jej zawartość znika. Dysk SSD lub HDD to pamięć masowa: zapisane pliki zostają po wyłączeniu komputera.',prompt:'Przyporządkuj cztery sytuacje do pamięci RAM albo dysku. Kliknij zdanie, a następnie odpowiednią kategorię.',items:[['Otwarty program używa tej pamięci podczas działania.','RAM'],['Zapisane zdjęcie zostaje po wyłączeniu komputera.','DYSK'],['Po wyłączeniu zasilania dane z tej pamięci znikają.','RAM'],['Tutaj przechowujemy zapisany plik z wypracowaniem.','DYSK']]},
{title:'Technodetektyw',type:'quiz',time:'4 min',intro:'Nie każdy problem z komputerem oznacza to samo. Zastanów się, do czego służą konkretne urządzenia, zanim wybierzesz odpowiedź.',prompt:'Rozwiąż trzy krótkie zagadki. W każdym pytaniu wybierz jedną odpowiedź.',qs:[['Chcesz wydrukować plakat na papierze. Czego potrzebujesz?',['Skanera','Drukarki','Projektora'],1],['Chcesz wprowadzić do komputera papierowy rysunek jako plik. Co wybierzesz?',['Skaner','Monitor','Głośnik'],0],['Na szkolnym ekranie ma pojawić się prezentacja dla całej klasy. Jakie urządzenie może ją wyświetlić?',['Klawiatura','Dysk SSD','Projektor'],2]]},
{title:'Ustaw właściwą kolejność',type:'order',time:'4 min',intro:'Po włączeniu zasilania uruchamia się oprogramowanie rozruchowe (UEFI lub BIOS). Przygotowuje ono komputer i rozpoczyna uruchamianie systemu operacyjnego. Dopiero po załadowaniu systemu możemy pracować.',prompt:'Ułóż pięć etapów od pierwszego do ostatniego. Używaj strzałek.',items:['Włączamy zasilanie komputera.','UEFI/BIOS rozpoczyna pracę i sprawdza podzespoły.','Rozpoczyna się ładowanie systemu operacyjnego.','Pojawia się ekran logowania lub pulpit.','Otwieramy program i zaczynamy pracę.']},
{title:'Prawda czy fałsz?',type:'tf',time:'4 min',intro:'Komputer może mieć różną formę: stacjonarną albo przenośną. Laptop zwykle ma wbudowany ekran i klawiaturę, a tablet najczęściej obsługujemy dotykiem. Programy i system operacyjny są różnymi rodzajami oprogramowania.',prompt:'Oceń każde zdanie. Nie zgaduj — wykorzystaj to, czego się dowiedziałeś.',items:[['Laptop można przenosić z miejsca na miejsce.',true],['Tablet zawsze musi mieć osobną klawiaturę, aby działać.',false],['System operacyjny pomaga uruchamiać programy i obsługiwać urządzenia.',true],['Po wyłączeniu komputera zapisane pliki na SSD zwykle znikają.',false],['Smartfon może pełnić funkcję nawigacji.',true]]},
{title:'Komputer w podróży',type:'sort',time:'3 min',intro:'Komputer stacjonarny zazwyczaj stoi na biurku. Laptop, tablet i smartfon to urządzenia mobilne, które wygodnie zabrać ze sobą. Urządzenia można wybierać zgodnie z potrzebami.',prompt:'Do jakiej grupy zaliczysz te urządzenia? Kliknij nazwę urządzenia, a potem kategorię.',items:[['Komputer stacjonarny z osobnym monitorem','STACJONARNY'],['Laptop','MOBILNY'],['Tablet','MOBILNY'],['Smartfon','MOBILNY']]},
{title:'Co robi system operacyjny?',type:'multi',time:'4 min',intro:'System operacyjny zarządza pracą komputera: umożliwia działanie programów, obsługę urządzeń i pracę z plikami. Windows, macOS i Linux to przykłady systemów operacyjnych.',prompt:'Zaznacz WSZYSTKIE trzy zadania, które należą do systemu operacyjnego.',items:[['Umożliwia uruchamianie aplikacji.',true],['Zamienia papier w wydruk bez drukarki.',false],['Pomaga zarządzać plikami.',true],['Steruje pracą urządzeń komputera.',true],['Sam wymienia uszkodzone podzespoły.',false]]},
{title:'Symulator: uruchom program',type:'steps',time:'4 min',intro:'Program jest zapisany na dysku. Gdy go uruchamiasz, potrzebne elementy programu trafiają do pamięci RAM, a procesor wykonuje jego instrukcje. Program może wyświetlić swoje okno.',prompt:'Kliknij kolejne etapy w prawidłowej kolejności. Każdy wybrany etap będzie podświetlony.',items:['Program znajduje się na dysku.','Potrzebne dane i instrukcje trafiają do RAM.','Procesor wykonuje instrukcje programu.','Pojawia się okno programu.']},
{title:'Urządzenia do zadań specjalnych',type:'match',time:'4 min',intro:'Urządzenia zewnętrzne rozszerzają możliwości komputera. Drukarka przenosi treść na papier, skaner zamienia papierowy dokument na obraz cyfrowy, projektor wyświetla obraz, a kamera internetowa rejestruje obraz.',prompt:'Dopasuj urządzenia do ich zastosowań.',items:[['Drukarka','Przygotowuje papierową kopię pracy.'],['Skaner','Tworzy cyfrowy obraz papierowego dokumentu.'],['Projektor','Pokazuje prezentację na dużej powierzchni.'],['Kamera internetowa','Przekazuje obraz podczas wideorozmowy.']]},
{title:'Zdiagnozuj sytuację',type:'quiz',time:'4 min',intro:'Wykorzystaj wiedzę o pamięci, urządzeniach i programach. Wybieraj rozwiązania wynikające z opisu problemu, nie przypadkowe odpowiedzi.',prompt:'Trzy sytuacje z prawdziwego życia — która odpowiedź jest najlepsza?',qs:[['Ania narysowała obrazek i chce, żeby został po wyłączeniu komputera. Co powinna zrobić?',['Zostawić otwarty program bez zapisywania','Zapisać plik na dysku','Odłączyć monitor'],1],['Kuba chce wygodnie pisać dłuższy tekst na tablecie. Co może mu pomóc?',['Zewnętrzna klawiatura','Projektor','Skaner'],0],['Ola chce porozmawiać przez wideo. Jakie urządzenie służy do rejestrowania jej obrazu?',['Drukarka','Dysk HDD','Kamera internetowa'],2]]},
{title:'Wielki finał: mistrz sprzętu',type:'final',time:'5 min',intro:'Teraz nie ma nowych definicji — czas wykorzystać wiedzę z całej misji. Zdobędziesz odznakę, jeśli pokażesz, że rozumiesz działanie komputera.',prompt:'Uzupełnij trzy zdania, wybierając właściwe określenia.',qs:[['Wykonywaniem instrukcji programów zajmuje się…',['procesor','monitor','skaner'],0],['Po zapisaniu pracy na dysku SSD, a potem wyłączeniu komputera, plik…',['zwykle pozostaje zapisany','zawsze znika','przenosi się do myszy'],0],['Aby korzystać z programów i urządzeń, komputer potrzebuje…',['systemu operacyjnego','drukarki 3D','projektora'],0]]}
];
const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));const shuffle=a=>[...a].map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);const fresh=()=>({started:false,index:0,points:[],name:'',startedAt:Date.now(),finished:false});let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh();if(!Array.isArray(S.points)||S.index<0||S.index>missions.length)S=fresh()}catch{S=fresh()}let A={};function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}}function reset(){if(confirm('Usunąć cały zapisany postęp i rozpocząć od początku?')){S=fresh();save();render()}}$('#restartTop').onclick=reset;
function starter(){A={type:missions[S.index]?.type,answers:{},selected:null,submitted:false,checkMsg:'',shuffle:[]};const m=missions[S.index];if(!m)return;if(['match','sort'].includes(m.type))A.shuffle=shuffle(m.items.map((_,i)=>i));if(m.type==='case'){A.shuffle=shuffle([...m.items.map((_,i)=>i),...m.extras.map((_,i)=>i+4)]);A.slots={}}if(m.type==='order')A.order=shuffle(m.items.map((_,i)=>i));if(m.type==='steps')A.steps=[]}
function intro(){return `<section class="hero"><div class="eyebrow">Przygoda edukacyjna · 12 misji</div><h1>Misja:<br>Wnętrze komputera</h1><p>Poznaj podzespoły, rozwikłaj techniczne zagadki, uruchom wirtualny komputer i zdobądź odznakę młodego eksperta.</p><div class="actions"><button class="btn large" id="start">Rozpocznij misję →</button></div></section><div class="stats"><div class="stat"><b>12</b><span>różnorodnych etapów</span></div><div class="stat"><b>~45 min</b><span>pracy z materiałem</span></div><div class="stat"><b>Offline</b><span>bez internetu</span></div></div><div class="panel" style="margin-top:18px"><h3>Jak pracujemy?</h3><p>Czytaj krótkie wyjaśnienia przed każdym zadaniem, a następnie wykonuj polecenia. Możesz poprawiać odpowiedzi przed sprawdzeniem. Po zatwierdzeniu zadania przejdziesz dalej. Wynik zobaczysz na końcu.</p><label for="student">Imię i nazwisko (opcjonalnie)</label><input class="answerbox" id="student" style="margin-top:7px;max-width:440px" placeholder="Wpisz swoje imię i nazwisko" value="${esc(S.name)}"><p class="hint">Postęp zapisuje się na tym urządzeniu. Przycisk „Zacznij od nowa” przygotuje kartę dla następnego ucznia.</p></div>`}
function task(){const m=missions[S.index],n=S.index+1;return `<section class="panel"><div class="headrow"><div><div class="tasklabel">Misja ${n} z ${missions.length} · ${esc(m.time)}</div><h2>${esc(m.title)}</h2></div><span class="pill">⭐ ${S.points.reduce((a,b)=>a+b,0)} pkt</span></div><div class="progress"><div style="width:${S.index/missions.length*100}%"></div></div><div class="lesson"><strong>📘 Warto wiedzieć</strong>${esc(m.intro)}</div><h3>${esc(m.prompt)}</h3><div id="work">${build(m)}</div><div id="response" role="status" aria-live="polite"></div><div class="foot row space"><span class="hint">Najpierw odpowiedz, potem kliknij „Sprawdź”.</span><div class="row"><button class="btn" id="validate">Sprawdź odpowiedzi</button><button class="btn secondary" style="display:none" id="next">Dalej →</button></div></div></section>`}
function build(m){let t=m.type;if(t==='match'){return `<div class="board"><div class="grid cols2"><div><h3>Wybierz nazwę</h3><div class="grid">${A.shuffle.map(i=>`<button class="tile" data-pick="${i}">${esc(m.items[i][0])}</button>`).join('')}</div></div><div><h3>Wybierz opis</h3><div class="grid">${m.items.map((x,i)=>`<button class="target" data-target="${i}"><span>${esc(x[1])}</span><small class="assigned" id="ass${i}">—</small></button>`).join('')}</div></div></div></div>`}
if(t==='sort'){let cats=[...new Set(m.items.map(v=>v[1]))];return `<div class="board"><div class="grid cols2"><div><h3>Kliknij zdanie</h3><div class="grid">${A.shuffle.map(i=>`<button class="tile" data-pick="${i}">${esc(m.items[i][0])}</button>`).join('')}</div></div><div><h3>Przypisz do kategorii</h3><div class="grid">${cats.map(c=>`<button class="target" data-cat="${esc(c)}"><span class="bigword">${esc(c==='DYSK'?'Dysk SSD / HDD':c==='RAM'?'Pamięć RAM':c==='MOBILNY'?'Urządzenie mobilne':'Komputer stacjonarny')}</span><small>Kliknij tutaj po wybraniu zdania</small></button>`).join('')}</div><p class="hint">Po przypisaniu etykieta pojawi się przy zdaniu.</p></div></div></div>`}
if(t==='case'){let parts=[...m.items.map(x=>x[0]),...m.extras];return `<div class="grid cols2 board"><div><div class="case">${m.items.map((x,i)=>`<button class="slot" data-slot="${i}"><span class="icon">${['🧠','🟩','💾','🔌'][i]}</span><span>${esc(x[1])}</span><b id="slot${i}">+ Umieść część</b></button>`).join('')}</div></div><div><h3>Magazyn części</h3><div class="grid cols2">${A.shuffle.map(i=>`<button class="part" data-part="${i}">${esc(parts[i])}</button>`).join('')}</div><p class="hint">W tym uproszczonym schemacie pola odpowiadają funkcjom podzespołów, a nie dokładnym miejscom montażu.</p></div></div>`}
if(t==='quiz'||t==='final'){return `<div class="grid">${m.qs.map((q,i)=>`<div class="board"><strong>${i+1}. ${esc(q[0])}</strong><div class="grid cols3" style="margin-top:13px">${q[1].map((x,j)=>`<button class="choice" data-q="${i}" data-o="${j}">${esc(x)}</button>`).join('')}</div></div>`).join('')}</div>`}
if(t==='multi'){return `<div class="board"><div class="grid cols2">${m.items.map((x,i)=>`<button class="choice" data-toggle="${i}" aria-pressed="false">☐ ${esc(x[0])}</button>`).join('')}</div></div>`}
if(t==='tf'){return `<div class="board grid">${m.items.map((x,i)=>`<div class="row space" style="padding:12px 0;border-bottom:1px solid #e5edf7"><strong style="flex:1;min-width:190px">${i+1}. ${esc(x[0])}</strong><div class="row"><button class="switch" data-tf="${i}" data-val="1">Prawda</button><button class="switch" data-tf="${i}" data-val="0">Fałsz</button></div></div>`).join('')}</div>`}
if(t==='order'){return `<div class="board"><div id="ordering">${A.order.map((i,pos)=>`<div class="orderitem"><div><span class="pill">${pos+1}</span> ${esc(m.items[i])}</div><div class="row"><button class="btn secondary" data-move="${pos}" data-delta="-1" aria-label="Przesuń w górę">↑</button><button class="btn secondary" data-move="${pos}" data-delta="1" aria-label="Przesuń w dół">↓</button></div></div>`).join('')}</div></div>`}
if(t==='steps'){return `<div class="board"><div class="diagram"><div>💾<br><b>Dysk</b></div><span class="arrow">→</span><div>🟩<br><b>RAM</b></div><span class="arrow">→</span><div>⚙️<br><b>Procesor</b></div><span class="arrow">→</span><div>🖥️<br><b>Ekran</b></div></div><hr><div class="grid cols2">${shuffle(m.items.map((_,i)=>i)).map(i=>`<button class="tile" data-step="${i}">${esc(m.items[i])}</button>`).join('')}</div><p class="hint" id="stepsFeedback">Wybrane etapy: 0 z 4</p><button class="btn ghost" id="undoSteps" type="button">↶ Cofnij ostatni wybór</button></div>`}
}
function wire(){const m=missions[S.index],t=m.type;function choose(sel,fun){document.querySelectorAll(sel).forEach(e=>e.addEventListener('click',()=>fun(e)))}if(t==='match'||t==='sort'){choose('[data-pick]',el=>{A.selected=+el.dataset.pick;document.querySelectorAll('[data-pick]').forEach(e=>e.classList.toggle('selected',+e.dataset.pick===A.selected))});if(t==='match')choose('[data-target]',el=>{if(A.selected==null)return;for(const k in A.answers)if(A.answers[k]===A.selected)delete A.answers[k];A.answers[el.dataset.target]=A.selected;A.selected=null;drawAssignments()});else choose('[data-cat]',el=>{if(A.selected==null)return;A.answers[A.selected]=el.dataset.cat;A.selected=null;drawAssignments()})}if(t==='case'){choose('[data-part]',e=>{A.selected=+e.dataset.part;document.querySelectorAll('[data-part]').forEach(el=>el.classList.toggle('active',+el.dataset.part===A.selected))});choose('[data-slot]',e=>{if(A.selected==null)return;for(let k in A.slots)if(A.slots[k]===A.selected)delete A.slots[k];A.slots[e.dataset.slot]=A.selected;A.selected=null;drawAssignments()})}if(t==='quiz'||t==='final'){choose('[data-q]',e=>{A.answers[e.dataset.q]=+e.dataset.o;document.querySelectorAll(`[data-q="${e.dataset.q}"]`).forEach(x=>x.classList.toggle('selected',x===e))})}if(t==='multi'){choose('[data-toggle]',e=>{let i=+e.dataset.toggle;A.answers[i]=!A.answers[i];e.classList.toggle('selected',A.answers[i]);e.setAttribute('aria-pressed',String(!!A.answers[i]));e.textContent=(A.answers[i]?'☑ ':'☐ ')+m.items[i][0]})}if(t==='tf'){choose('[data-tf]',e=>{let i=+e.dataset.tf;A.answers[i]=e.dataset.val==='1';document.querySelectorAll(`[data-tf="${i}"]`).forEach(x=>{let on=x===e;x.classList.toggle('on',on);x.classList.remove('off')})})}if(t==='order'){choose('[data-move]',e=>{let i=+e.dataset.move,j=i+(+e.dataset.delta);if(j<0||j>=A.order.length)return;[A.order[i],A.order[j]]=[A.order[j],A.order[i]];$('#ordering').innerHTML=build(m).match(/<div id="ordering">([\s\S]*?)<\/div><\/div>$/)?.[1]||'';wireOrder()})}if(t==='steps'){choose('[data-step]',e=>{let i=+e.dataset.step;if(A.steps.includes(i))return;A.steps.push(i);e.classList.add('selected');$('#stepsFeedback').textContent=`Wybrane etapy: ${A.steps.length} z 4`;});$('#undoSteps').onclick=()=>{A.steps.pop();document.querySelectorAll('[data-step]').forEach(e=>e.classList.toggle('selected',A.steps.includes(+e.dataset.step)));$('#stepsFeedback').textContent=`Wybrane etapy: ${A.steps.length} z 4`}}$('#validate').onclick=validate;$('#next').onclick=()=>{S.index++;S.finished=S.index>=missions.length;save();starter();render();window.scrollTo(0,0)}}
function wireOrder(){document.querySelectorAll('[data-move]').forEach(e=>e.onclick=()=>{let i=+e.dataset.move,j=i+(+e.dataset.delta);if(j<0||j>=A.order.length)return;[A.order[i],A.order[j]]=[A.order[j],A.order[i]];const m=missions[S.index];$('#ordering').innerHTML=A.order.map((idx,pos)=>`<div class="orderitem"><div><span class="pill">${pos+1}</span> ${esc(m.items[idx])}</div><div class="row"><button class="btn secondary" data-move="${pos}" data-delta="-1">↑</button><button class="btn secondary" data-move="${pos}" data-delta="1">↓</button></div></div>`).join('');wireOrder()})}
function drawAssignments(){const m=missions[S.index];if(m.type==='match'){document.querySelectorAll('[data-pick]').forEach(e=>e.classList.toggle('selected',+e.dataset.pick===A.selected));m.items.forEach((x,i)=>{$('#ass'+i).textContent=A.answers[i]===undefined?'—':m.items[A.answers[i]][0]})}if(m.type==='sort'){document.querySelectorAll('[data-pick]').forEach(e=>{let i=+e.dataset.pick;e.classList.toggle('selected',i===A.selected);e.innerHTML=esc(m.items[i][0])+(A.answers[i]?`<br><span class="pill">${esc(A.answers[i])}</span>`:'')})}if(m.type==='case'){let parts=[...m.items.map(x=>x[0]),...m.extras];document.querySelectorAll('[data-part]').forEach(e=>{let i=+e.dataset.part;e.classList.toggle('active',i===A.selected);e.classList.toggle('used',Object.values(A.slots).includes(i))});m.items.forEach((x,i)=>{$('#slot'+i).textContent=A.slots[i]===undefined?'+ Umieść część':parts[A.slots[i]]})}}
function validate(){const m=missions[S.index],t=m.type;let pts=0,max=0,complete=true;let details=[];if(t==='match'){max=m.items.length;complete=Object.keys(A.answers).length===max;for(let i=0;i<max;i++){if(A.answers[i]===i)pts++;else details.push(`${m.items[i][1]} → ${m.items[i][0]}`)}}else if(t==='sort'){max=m.items.length;complete=Object.keys(A.answers).length===max;for(let i=0;i<max;i++)if(A.answers[i]===m.items[i][1])pts++;else details.push(`${m.items[i][0]} → ${m.items[i][1]}`)}else if(t==='case'){max=4;complete=Object.keys(A.slots).length===4;for(let i=0;i<4;i++)if(A.slots[i]===i)pts++;else details.push(`${m.items[i][1]} → ${m.items[i][0]}`)}else if(t==='quiz'||t==='final'){max=m.qs.length;complete=Object.keys(A.answers).length===max;for(let i=0;i<max;i++)if(A.answers[i]===m.qs[i][2])pts++;else details.push(`${m.qs[i][0]} → ${m.qs[i][1][m.qs[i][2]]}`)}else if(t==='tf'){max=m.items.length;complete=Object.keys(A.answers).length===max;for(let i=0;i<max;i++)if(A.answers[i]===m.items[i][1])pts++;else details.push(`${m.items[i][0]} → ${m.items[i][1]?'Prawda':'Fałsz'}`)}else if(t==='multi'){max=m.items.length;for(let i=0;i<max;i++)if(!!A.answers[i]===m.items[i][1])pts++;else details.push(m.items[i][0]);}else if(t==='order'){max=m.items.length;pts=m.items.reduce((a,_,i)=>a+(A.order[i]===i?1:0),0);if(pts!==max)details.push('Poprawna kolejność: '+m.items.join(' → '))}else if(t==='steps'){max=m.items.length;complete=A.steps.length===max;pts=m.items.reduce((n,_,i)=>n+(A.steps[i]===i?1:0),0);if(pts!==max)details.push('Kolejność: '+m.items.join(' → '))}if(!complete){$('#response').innerHTML='<div class="notice no">Uzupełnij wszystkie odpowiedzi, zanim sprawdzisz zadanie.</div>';return}if(A.submitted)return;A.submitted=true;S.points[S.index]=pts;save();const success=pts===max;$('#response').innerHTML=`<div class="notice ${success?'ok':'no'}"><strong>${success?'🎉 Brawo! Wszystko poprawnie.':'🔎 Zadanie sprawdzone.'}</strong> Zdobyte punkty: ${pts} / ${max}.${details.length?`<details style="margin-top:8px"><summary>Sprawdź poprawne rozwiązania</summary><div style="margin-top:6px;font-weight:450">${details.map(x=>'• '+esc(x)).join('<br>')}</div></details>`:''}</div>`;document.querySelectorAll('#work button').forEach(e=>e.disabled=true);$('#validate').style.display='none';$('#next').style.display='inline-block';$('#next').textContent=S.index===missions.length-1?'Zobacz wynik →':'Następna misja →';}
function finish(){let total=S.points.reduce((a,b)=>a+b,0),max=missions.reduce((a,m)=>a+(['match','sort','case','tf','multi','order','steps'].includes(m.type)?m.items.length:m.qs.length),0),percent=Math.round(total/max*100),badge=percent>=85?'🏆 Mistrz wnętrza komputera':percent>=60?'🌟 Młody technodetektyw':'🔧 Początkujący odkrywca';return `<section class="panel"><div class="tasklabel">Misja ukończona</div><h1>Udało się! 🎉</h1><div class="report"><h2>${badge}</h2><p>${esc(S.name||'Uczeń klasy 5')}</p><div style="font-size:3rem;font-weight:950">${total} / ${max} pkt</div><strong>${percent}% poprawnych odpowiedzi</strong><p>${percent>=85?'Świetnie rozumiesz podstawowe elementy komputera.':percent>=60?'Znasz już sporo elementów. Warto powtórzyć trudniejsze zagadnienia.':'Wróć do wyjaśnień i spróbuj jeszcze raz — każda próba pomaga się nauczyć.'}</p></div><h3 style="margin-top:24px">Wyniki poszczególnych misji</h3><div class="grid cols2">${missions.map((m,i)=>`<div class="orderitem"><span>${i+1}. ${esc(m.title)}</span><b>${S.points[i]} pkt</b></div>`).join('')}</div><div class="actions no-print"><button class="btn" id="copyResult">Kopiuj wynik</button><button class="btn secondary" id="printResult">Drukuj / zapisz PDF</button><button class="btn ghost" id="again">Rozpocznij ponownie</button></div><p class="hint no-print">Wyniki nie są wysyłane automatycznie do nauczyciela. Możesz je skopiować lub zapisać do PDF.</p></section>`}
function render(){if(!S.started){$('#app').innerHTML=intro();$('#start').onclick=()=>{S.started=true;S.name=$('#student').value.trim().slice(0,90);save();starter();render()};return}if(S.finished){$('#app').innerHTML=finish();$('#again').onclick=reset;$('#printResult').onclick=()=>window.print();$('#copyResult').onclick=async()=>{let text=`Misja: Wnętrze komputera\nUczeń: ${S.name||'brak danych'}\nWynik: ${S.points.reduce((a,b)=>a+b,0)} pkt\n`+missions.map((m,i)=>`${i+1}. ${m.title}: ${S.points[i]} pkt`).join('\n');try{await navigator.clipboard.writeText(text);$('#copyResult').textContent='Skopiowano ✓'}catch{prompt('Skopiuj wynik:',text)}};return}if(!A.type||A.type!==missions[S.index].type)starter();$('#app').innerHTML=task();wire();if(missions[S.index].type==='order')wireOrder();}
// Resuming midway intentionally starts only the current task from the beginning; completed scores remain saved.
starter();render();
</script></body></html>
